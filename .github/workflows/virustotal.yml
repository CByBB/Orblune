name: VirusTotal

# Backup / backfill scanner.
# Note: `release: published` alone will NOT fire when the Release workflow
# creates the release with GITHUB_TOKEN — primary scan lives in release.yml.

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to scan (e.g. v0.1.4)
        required: true
        type: string
  workflow_run:
    workflows: ["Release"]
    types: [completed]

permissions:
  contents: write

jobs:
  scan:
    if: >
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success')
    runs-on: ubuntu-latest
    steps:
      - name: Resolve tag
        id: tag
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "name=${{ inputs.tag }}" >> "$GITHUB_OUTPUT"
          else
            # Prefer the tag that triggered the Release workflow
            head_branch="${{ github.event.workflow_run.head_branch }}"
            if [[ "$head_branch" == v* ]]; then
              echo "name=$head_branch" >> "$GITHUB_OUTPUT"
            else
              tag="$(gh release view --repo "${{ github.repository }}" --json tagName -q .tagName)"
              echo "name=$tag" >> "$GITHUB_OUTPUT"
            fi
          fi

      - name: Download release installers
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p release-assets
          gh release download "${{ steps.tag.outputs.name }}" \
            --repo "${{ github.repository }}" \
            --dir release-assets \
            --pattern "Orblune_*-setup.exe" || true
          ls -la release-assets || true
          test -n "$(ls -A release-assets 2>/dev/null)" || {
            echo "No setup.exe assets found for ${{ steps.tag.outputs.name }}"
            exit 1
          }

      - name: VirusTotal scan
        id: vt
        uses: crazy-max/ghaction-virustotal@v5
        with:
          vt_api_key: ${{ secrets.VT_API_KEY }}
          request_rate: 4
          files: |
            release-assets/*.exe

      - name: Append VirusTotal links to release notes
        if: ${{ steps.vt.outputs.analysis != '' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ANALYSIS: ${{ steps.vt.outputs.analysis }}
          TAG: ${{ steps.tag.outputs.name }}
        run: |
          set -euo pipefail
          body="$(gh release view "$TAG" --json body -q .body)"
          if echo "$body" | grep -q "### VirusTotal"; then
            echo "Release notes already include VirusTotal section; skipping."
            exit 0
          fi
          {
            printf '%s\n\n' "$body"
            echo "### VirusTotal"
            echo ""
            IFS=',' read -ra parts <<< "$ANALYSIS"
            for part in "${parts[@]}"; do
              [ -z "$part" ] && continue
              file="${part%%=*}"
              url="${part#*=}"
              base="$(basename "$file")"
              echo "- [\`${base}\`](${url})"
            done
          } > release-body.md
          gh release edit "$TAG" --notes-file release-body.md
