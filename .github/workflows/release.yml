name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install frontend dependencies
        run: npm ci

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Build and publish Orblune
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: Orblune ${{ github.ref_name }}
          releaseBody: |
            ## Orblune ${{ github.ref_name }}

            Download **Orblune_*_x64-setup.exe** and double-click to install (current user, no admin).

            After install, Orblune opens from the system tray. Use **Check for updates** in About to stay current.

            ### Security
            CI uploads the installer to [VirusTotal](https://www.virustotal.com/) and appends analysis links below.
            Unsigned Windows apps may still show SmartScreen once; choose **More info → Run anyway**.
            A paid Authenticode certificate is what improves SmartScreen trust over time.
          releaseDraft: false
          prerelease: false
          args: --target x86_64-pc-windows-msvc

      # GITHUB_TOKEN-created releases do not trigger separate `release` workflows,
      # so VirusTotal must run in this same job.
      - name: VirusTotal scan installer
        id: vt
        uses: crazy-max/ghaction-virustotal@v5
        with:
          vt_api_key: ${{ secrets.VT_API_KEY }}
          request_rate: 4
          files: |
            **/Orblune_*_x64-setup.exe

      - name: Append VirusTotal links to release notes
        if: ${{ success() && steps.vt.outputs.analysis != '' }}
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ANALYSIS: ${{ steps.vt.outputs.analysis }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          body="$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json body -q .body)"
          {
            printf '%s\n\n' "$body"
            echo "### VirusTotal"
            echo ""
            IFS=',' read -ra parts <<< "$ANALYSIS"
            for part in "${parts[@]}"; do
              [ -z "$part" ] && continue
              file="${part%%=*}"
              url="${part#*=}"
              base="$(basename "$file")"
              echo "- [\`${base}\`](${url})"
            done
          } > release-body.md
          gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --notes-file release-body.md

      - name: Point marketing site at this installer
        if: ${{ success() }}
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          VER="${TAG#v}"
          NAME="Orblune_${VER}_x64-setup.exe"
          URL="https://github.com/${GITHUB_REPOSITORY}/releases/download/${TAG}/${NAME}"
          git fetch origin main
          git checkout -B main origin/main
          printf '%s\n' "{\"tag\":\"${TAG}\",\"name\":\"${NAME}\",\"url\":\"${URL}\"}" > docs/latest-download.json
          # Keep no-JS download buttons pointing at the same asset.
          python - <<'PY'
          from pathlib import Path
          import json, re
          data = json.loads(Path("docs/latest-download.json").read_text(encoding="utf-8"))
          html_path = Path("docs/index.html")
          html = html_path.read_text(encoding="utf-8")
          html = re.sub(
              r'https://github\.com/CByBB/Orblune/releases/download/v[\w.-]+/Orblune_[\w.-]+_x64-setup\.exe',
              data["url"],
              html,
          )
          html = re.sub(
              r'download="Orblune_[\w.-]+_x64-setup\.exe"',
              f'download="{data["name"]}"',
              html,
          )
          html_path.write_text(html, encoding="utf-8")
          PY
          git add docs/latest-download.json docs/index.html
          if git diff --cached --quiet; then
            echo "Download pointer already current."
            exit 0
          fi
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
            commit -m "Point marketing download at ${TAG}."
          git push origin main
