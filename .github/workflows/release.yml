name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install frontend dependencies
        run: npm ci

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Build and publish Orblune
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: Orblune ${{ github.ref_name }}
          releaseBody: |
            ## Orblune ${{ github.ref_name }}

            Download **Orblune_*_x64-setup.exe** and double-click to install (current user, no admin).

            After install, Orblune opens from the system tray.

            ### Security
            After publish, CI uploads the installer to [VirusTotal](https://www.virustotal.com/) and appends analysis links below.
            Unsigned Windows apps may still show SmartScreen once; choose **More info → Run anyway**.
            A paid Authenticode certificate is what improves SmartScreen trust over time.
          releaseDraft: false
          prerelease: false
          args: --target x86_64-pc-windows-msvc
